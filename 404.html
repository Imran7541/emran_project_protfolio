<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Emran Hosen</title>
  
  <!-- Smart Route Reconciler for GitHub Pages Clean URLs -->
  <script>
    (function() {
      try {
        var p = window.location.pathname;
        // Check for trailing slashes or legacy .html extensions
        if (p.endsWith('/gallery/') || p.endsWith('/gallery.html')) {
          var clean = p.replace(/\/gallery(\/|\.html)?$/, '/gallery') + window.location.search + window.location.hash;
          window.location.replace(clean);
        } else if (p.endsWith('/contact/') || p.endsWith('/contact.html')) {
          var clean = p.replace(/\/contact(\/|\.html)?$/, '/contact') + window.location.search + window.location.hash;
          window.location.replace(clean);
        } else if (p.endsWith('/index.html')) {
          var clean = p.replace(/\/index\.html$/, '/') + window.location.search + window.location.hash;
          window.location.replace(clean);
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            montserrat: ['Montserrat', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            noir: '#0D151C',
            accent: '#FF715B',
            coralHover: '#ff8a78'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#121E27] text-white min-h-screen flex flex-col items-center justify-center p-6 font-montserrat relative overflow-hidden">

      <a href="gallery" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white font-semibold text-xs tracking-wider uppercase transition-all flex items-center justify-center gap-2">
